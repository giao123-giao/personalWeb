<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="张银豪 - 作品展示">
    <meta name="keywords" content="产品经理,AI产品经理,作品集,项目展示">
    <meta name="author" content="张银豪">
    <title>张银豪 - 作品展示</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B35;
            --primary-light: #FF8C5A;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2D3436;
            --light: #FAFAFA;
            --gray: #636E72;
            --card-bg: #FFFFFF;
            --text-primary: #2D3436;
            --text-secondary: #636E72;
            --bg-primary: #FAFAFA;
            --bg-secondary: #FFFFFF;
            --border-color: #2D3436;
            --transition-normal: 0.3s;
            --radius-lg: 20px;
            --spacing-xl: 60px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #FF8C5A;
                --primary-light: #FFAB7A;
                --secondary: #6ED9D0;
                --accent: #FFE66D;
                --dark: #FAFAFA;
                --light: #1A1A2E;
                --gray: #A0A0A0;
                --card-bg: #16213E;
                --text-primary: #FAFAFA;
                --text-secondary: #A0A0A0;
                --bg-primary: #0F0F1A;
                --bg-secondary: #1A1A2E;
                --border-color: #3A3A5A;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', 'Space Grotesk', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color var(--transition-normal), color var(--transition-normal);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        .page-title {
            font-size: clamp(36px, 6vw, 64px);
            font-weight: 900;
            text-align: center;
            margin-bottom: var(--spacing-xl);
            letter-spacing: -2px;
            color: var(--text-primary);
        }

        .page-title .accent {
            color: var(--primary);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            padding: 12px 24px;
            border: 2px solid var(--border-color);
            border-radius: 30px;
            transition: all var(--transition-normal);
            margin-top: 40px;
        }

        .back-link:hover {
            background: var(--text-primary);
            color: var(--bg-primary);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .project-card {
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: all var(--transition-normal);
            position: relative;
        }

        .project-card:hover {
            transform: translate(-5px, -5px);
            box-shadow: 10px 10px 0 var(--border-color);
        }

        .project-cover {
            height: 220px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }

        .project-content {
            padding: 25px;
        }

        .project-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .project-tag {
            background: var(--primary);
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .project-tag.secondary {
            background: var(--secondary);
        }

        .project-role {
            background: rgba(78, 205, 196, 0.15);
            color: var(--secondary);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--secondary);
        }

        .project-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .project-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .project-stats {
            display: flex;
            gap: 20px;
            padding-top: 20px;
            border-top: 2px dashed var(--border-color);
        }

        .project-stat {
            text-align: center;
            flex: 1;
        }

        .project-stat-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .project-stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        @media (max-width: 1024px) {
            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <h1 class="page-title">我的<span class="accent">作品</span></h1>
            <div class="projects-grid">
                <div class="project-card" onclick="window.location.href='work-detail.html?id=quality-trace'" style="cursor: pointer;">
                    <div class="project-cover" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">🤖</div>
                    <div class="project-content">
                        <div class="project-meta">
                            <span class="project-tag">小程序</span>
                            <span class="project-role">个人想法</span>
                        </div>
                        <h3 class="project-title">去哪儿屙小程序原型</h3>
                        <p class="project-desc">随着城市建设的发展，公共厕所的分布越来越广泛，但用户在陌生环境中往往难以快速找到附近的厕所。尤其是在旅游景区、商业区等人流密集的地方，寻找厕所成为了用户的痛点。"去哪儿屙"小程序旨在帮助用户快速找到附近的公共厕所，提供详细的厕所信息和导航服务，同时允许用户对厕所进行评价，为其他用户提供参考。</p>
                       
                    </div>
                </div>

                <div class="project-card" onclick="window.location.href='work-detail.html?id=visitor-mgmt'" style="cursor: pointer;">
                    <div class="project-cover" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);">🏭</div>
                    <div class="project-content">
                        <div class="project-meta">
                            <span class="project-tag">PRD</span>
                            <span class="project-role">需求文档</span>
                        </div>
                        <h3 class="project-title">去哪儿屙小程序PRD</h3>
                        <p class="project-desc">去哪儿屙小程序的需求文档（PRD）描述，包括功能需求、非功能需求、界面设计等。</p>
                        
                    </div>
                </div>
            </div>
            <a href="index.html" class="back-link">
                ← 返回主页
            </a>
        </div>
    </main>
</body>
</html>
