    <style>
        :root {
            --primary: #FF6B35;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2D3436;
            --light: #FAFAFA;
            --gray: #636E72;
            --card-bg: #FFFFFF;
            --text-primary: #2D3436;
            --text-secondary: #636E72;
            --bg-primary: #FAFAFA;
            --border-color: #2D3436;
            --transition-normal: 0.3s;
            --radius-lg: 20px;
            --spacing-xl: 60px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #FF8C5A;
                --secondary: #6ED9D0;
                --accent: #FFE66D;
                --dark: #FAFAFA;
                --light: #1A1A2E;
                --gray: #A0A0A0;
                --card-bg: #16213E;
                --text-primary: #FAFAFA;
                --text-secondary: #A0A0A0;
                --bg-primary: #0F0F1A;
                --border-color: #3A3A5A;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', 'Space Grotesk', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            padding: 10px 20px;
            border: 2px solid var(--border-color);
            border-radius: 30px;
            transition: all var(--transition-normal);
            margin-bottom: 40px;
        }

        .back-link:hover {
            background: var(--text-primary);
            color: var(--bg-primary);
        }

        .article-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .article-tag {
            display: inline-block;
            background: var(--primary);
            color: white;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }

        .article-title {
            font-size: clamp(32px, 5vw, 48px);
            font-weight: 900;
            margin-bottom: 20px;
            letter-spacing: -1px;
            line-height: 1.3;
        }

        .article-date {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .article-excerpt {
            background: rgba(255, 107, 53, 0.1);
            border-left: 4px solid var(--primary);
            padding: 25px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 40px;
        }

        .article-excerpt strong {
            color: var(--primary);
            font-weight: 700;
        }

        .article-content {
            font-size: 17px;
            color: var(--text-secondary);
            line-height: 2;
        }

        .article-content p {
            margin-bottom: 25px;
        }

        .article-content h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 35px 0 20px;
            padding-bottom: 10px;
            border-bottom: 2px dashed var(--border-color);
        }

        .article-content ul {
            list-style: none;
            padding-left: 0;
            margin-bottom: 25px;
        }

        .article-content li {
            padding: 12px 0;
            border-bottom: 1px dashed var(--border-color);
            position: relative;
            padding-left: 28px;
            font-size: 16px;
        }

        .article-content li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: 700;
            font-size: 18px;
        }

        .article-content li:last-child {
            border-bottom: none;
        }

        .key-takeaways {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 35px;
            margin-top: 50px;
        }

        .key-takeaways h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .key-takeaways h3::before {
            content: '';
            width: 4px;
            height: 20px;
            background: var(--primary);
            border-radius: 2px;
        }

        .key-takeaways ul {
            list-style: none;
            padding-left: 0;
        }

        .key-takeaways li {
            padding: 10px 0;
            font-size: 15px;
            color: var(--text-secondary);
            padding-left: 24px;
            position: relative;
        }

        .key-takeaways li::before {
            content: '💡';
            position: absolute;
            left: 0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }

            .article-title {
                font-size: 28px;
            }

            .article-excerpt {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 16px;
            }

            .article-title {
                font-size: 24px;
            }

            .back-link {
                padding: 10px 18px;
                font-size: 14px;
            }

            .article-tag {
                font-size: 12px;
                padding: 4px 10px;
            }

            .article-date {
                font-size: 13px;
            }
        }
    </style>
</head>

<p>系统性思维是一种从整体出发，考虑各个部分之间相互关系和相互影响的思维方式。它要求我们不仅看到单个问题，还要看到问题所处的整个系统。</p>

</ul>

<ul>

                content: `<p>很多技术人员都有转型产品经理的想法，我也是其中之一。在这里分享我的转型心得，希望能给大家一些启发。</p>

        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        function renderArticle(articleId) {
            const article = articles[articleId];
            if (!article) {
                document.getElementById('articleTitle').textContent = '文章不存在';
                return;
            }

            document.title = article.title + ' - 工作感悟';
            document.getElementById('articleTitle').textContent = article.title;
            document.getElementById('articleTag').textContent = article.tag;
            document.getElementById('articleDate').textContent = article.date;
            document.getElementById('articleExcerpt').innerHTML = '<strong>核心观点：</strong>' + article.excerpt;
            document.getElementById('articleContent').innerHTML = article.content;

            const takeawaysHtml = article.takeaways.map(item => '<li>' + item + '</li>').join('');
            document.getElementById('articleTakeaways').innerHTML = takeawaysHtml;
        }

        function goBack() {
            history.back();
        }

        const articleId = getUrlParam('id') || 'systems-thinking';

</body>
