<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="项目详情">
    <meta name="keywords" content="产品经理,项目经验,产品案例">
    <meta name="author" content="张银豪">
    <title>项目详情</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B35;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2D3436;
            --light: #FAFAFA;
            --gray: #636E72;
            --card-bg: #FFFFFF;
            --text-primary: #2D3436;
            --text-secondary: #636E72;
            --bg-primary: #FAFAFA;
            --border-color: #E0E0E0;
            --transition-normal: 0.3s;
            --radius-lg: 16px;
            --spacing-xl: 50px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #FF8C5A;
                --secondary: #6ED9D0;
                --accent: #FFE66D;
                --dark: #FAFAFA;
                --light: #1A1A2E;
                --gray: #A0A0A0;
                --card-bg: #16213E;
                --text-primary: #FAFAFA;
                --text-secondary: #A0A0A0;
                --bg-primary: #0F0F1A;
                --border-color: #3A3A5A;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', 'Space Grotesk', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
        }

        .container {
            max-width: 90%;
            margin: 0 auto;
            padding: 0px 40px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            padding: 10px 20px;
            border: 2px solid var(--border-color);
            border-radius: 30px;
            transition: all var(--transition-normal);
            margin-bottom: 80px;
            margin-top: 40px;
        }

        .back-link:hover {
            background: var(--text-primary);
            color: var(--bg-primary);
        }

        .project-header {
            margin-bottom: var(--spacing-xl);
            text-align: center;
        }

        .project-role {
            display: inline-block;
            background: rgba(78, 205, 196, 0.15);
            color: var(--secondary);
            font-size: 13px;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--secondary);
            margin-bottom: 20px;
        }

        .project-title {
            font-size: clamp(32px, 5vw, 48px);
            font-weight: 900;
            margin-bottom: 20px;
            letter-spacing: -1px;
            line-height: 1.2;
            text-align: center;
        }

        .project-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 15px;
            color: var(--text-secondary);
            justify-content: center;
        }

        .project-meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .project-meta-item::before {
            content: '•';
            color: var(--primary);
            font-weight: bold;
        }

        .section {
            margin-bottom: var(--spacing-xl);
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid var(--primary);
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 28px;
            background: var(--primary);
            border-radius: 2px;
        }

        .section-content {
            font-size: 17px;
            color: var(--text-secondary);
            line-height: 2;
        }

        .section-content p {
            margin-bottom: 20px;
            text-align: justify;
        }

        .section-content ul {
            list-style: none;
            padding-left: 0;
        }

        .section-content li {
            padding: 15px 0;
            border-bottom: 1px dashed var(--border-color);
            position: relative;
            padding-left: 32px;
            font-size: 16px;
            color: var(--text-secondary);
        }

        .section-content li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: 700;
            font-size: 20px;
        }

        .section-content li:last-child {
            border-bottom: none;
        }

        .achievements-section {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 40px;
            margin-top: var(--spacing-xl);
            margin-bottom: 20px;
            border: 2px solid var(--border-color);
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 20px;
        }

        .achievement-item {
            text-align: center;
            padding: 25px;
            background: rgba(255, 107, 53, 0.1);
            border-radius: 12px;
        }

        .achievement-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 48px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
        }

        .achievement-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 10px;
        }

        .highlight-box {
            background: rgba(255, 107, 53, 0.08);
            border-left: 4px solid var(--primary);
            padding: 25px 30px;
            border-radius: 0 12px 12px 0;
            margin: 20px 0;
        }

        .highlight-box p {
            margin: 0;
            font-style: italic;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }

            .project-title {
                font-size: 28px;
            }

            .achievements-grid {
                grid-template-columns: 1fr;
            }

            .section-content li {
                padding-left: 24px;
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 16px;
            }

            .project-title {
                font-size: 24px;
            }

            .achievements-section {
                padding: 25px;
            }

            .achievement-value {
                font-size: 36px;
            }

            .back-link {
                padding: 10px 18px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <a href="#" onclick="goBack(); return false;" class="back-link">
                ← 返回上一页
            </a>

            <header class="project-header">
                
                <h1 class="project-title" id="projectTitle">项目名称</h1>

            </header>

            <section class="section">

                <div class="section-content" id="projectBackground">

                </div>
            </section>

            <section class="section">
                <h2 class="section-title">重点工作内容</h2>
                <div class="section-content" id="projectWork">
                    <ul>
                        <li>工作内容将在这里显示...</li>
                    </ul>
                </div>
            </section>

            <section class="section">
                <h2 class="section-title">核心功能</h2>
                <div class="section-content" id="projectFeatures">
                    <ul>
                        <li>核心功能将在这里显示...</li>
                    </ul>
                </div>
            </section>

            <section class="achievements-section">

                        <div class="achievement-value">0%</div>

                        <div class="achievement-value">0%</div>
                        <div class="achievement-label">用户满意度</div>
                    </div>
                </div>
            </section>
        </div>
    </main>

        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        function renderProject(projectId) {
            const project = projects[projectId];
            if (!project) {
                document.getElementById('projectTitle').textContent = '项目不存在';
                return;
            }

            document.title = project.title + ' - 项目详情';
            document.getElementById('projectTitle').textContent = project.title;
            document.getElementById('projectRole').textContent = project.role;

            document.getElementById('projectBackground').innerHTML = '<p>' + project.background + '</p>';

            const workList = project.work.map(item => '<li>' + item + '</li>').join('');
            document.getElementById('projectWork').innerHTML = '<ul>' + workList + '</ul>';

            const featureList = project.features.map(item => '<li>' + item + '</li>').join('');
            document.getElementById('projectFeatures').innerHTML = '<ul>' + featureList + '</ul>';

            const achievementsHtml = project.achievements.map(item => `
                <div class="achievement-item">
                    <div class="achievement-value">${item.value}</div>
                    <div class="achievement-label">${item.label}</div>
                </div>
            `).join('');
            document.getElementById('projectAchievements').innerHTML = achievementsHtml;
        }

        function goBack() {
            history.back();
        }

        const projectId = getUrlParam('id') || 'quality-trace';
        renderProject(projectId);
    </script>
</body>
</html>
